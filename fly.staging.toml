# shortlist.deployment.md, Configuration: what differs per environment is this
# file, checked in, so a configuration change is reviewed in a pull request
# rather than applied by hand. `flyctl deploy --config fly.staging.toml`
# reconciles the running app to it.
#
# Staging is for testing things before full deployment, and nothing stateful is
# shared with Production: its own app, its own Postgres, its own backup bucket.
# The container registry is the one resource both environments touch, and it
# holds images only.

app = "shortlist-staging"
primary_region = "lax"

# No [build] section, for the same reason as Production: the image is built once
# by the pipeline and deployed by tag. The tag Staging gets is the tag Production
# is later asked to approve.

[deploy]
  release_command = "bin/rails db:migrate"

[env]
  # RAILS_ENV is production here too. Staging is a production-mode app with its
  # own data, not a second development environment — docs/shortlist.deployment.md
  # leaves Local and Test to the development view.
  RAILS_ENV = "production"
  RAILS_LOG_LEVEL = "info"

[http_service]
  internal_port = 3000
  force_https = true

  # The difference from Production: Staging stops when idle. Nobody is waiting on
  # a first request here, so the latency that buys Production its always-on
  # machine is not worth the cost.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/up"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
