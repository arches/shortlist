# The local development environment, per shortlist.stack.md: it runs the API, the
# frontend dev server and Postgres, so nothing is external. Every command runs in
# here, tests included.
name: shortlist

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "${SHORTLIST_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    env_file: .env
    environment:
      # The suite checks the checked-in deployment configuration — the forbidden
      # connections in shortlist.deployment.md are facts about what must never be
      # wired up, so the files are what hold them. api/ is the working directory
      # in here, so the repository is mounted read-only and named. Nothing but
      # the examples reads it, and nothing can write to it.
      SHORTLIST_REPOSITORY_ROOT: /repo
    volumes:
      - ./api:/app
      - .:/repo:ro
    ports:
      - "${SHORTLIST_API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      # The dev server forwards /api to the api container. This is the dev
      # server's own configuration, not the bundle's — shortlist.principles.md
      # forbids configuration inside frontend/src, and nothing here crosses that
      # line.
      SHORTLIST_API_ORIGIN: http://api:3000
    volumes:
      - ./frontend:/app
      - frontend-modules:/app/node_modules
    ports:
      - "${SHORTLIST_FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  db-data:
  frontend-modules:
