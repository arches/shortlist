# Connection details come from DATABASE_URL, per shortlist.stack.md: configuration
# is environment variables read through ENV.fetch, and the variable keeps the name
# Rails already reads it under.
#
# A DATABASE_URL in the environment overrides anything named here, so the URL is
# the only place a database name can usefully live. The test run is given its own,
# from SHORTLIST_TEST_DATABASE_URL — Shortlist's own invention, so it carries the
# prefix the stack's Naming section requires.
default: &default
  adapter: postgresql
  encoding: unicode
  url: <%= ENV.fetch("DATABASE_URL") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
