# Connection details come from DATABASE_URL, per shortlist.stack.md: configuration
# is environment variables read through ENV.fetch, and the variable keeps the name
# Rails already reads it under. The per-environment `database` key overrides the
# name in the URL, so one variable serves development and test.
default: &default
  adapter: postgresql
  encoding: unicode
  url: <%= ENV.fetch("DATABASE_URL") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: shortlist_development

test:
  <<: *default
  database: shortlist_test

production:
  <<: *default
